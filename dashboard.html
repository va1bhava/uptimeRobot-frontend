<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UptimeRobot — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --border: #1e1e2e;
      --accent: #00e5a0;
      --accent2: #7c6af7;
      --text: #e8e8f0;
      --muted: #5a5a72;
      --error: #ff5f6d;
      --warn: #ffb547;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      width: 700px; height: 400px;
      background: radial-gradient(ellipse, rgba(0,229,160,0.05) 0%, transparent 70%);
      top: 0; left: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; }
    .nav-logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .nav-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 16px; font-weight: 800;
    }
    .nav-logo-text span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-email {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .btn-logout {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--error); color: var(--error); }

    /* MAIN */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 24px;
      position: relative; z-index: 1;
    }

    .page-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px; font-weight: 800;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* STATS BAR */
    .stats-bar {
      display: flex; gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 700;
    }
    .stat-value.green { color: var(--accent); }
    .stat-value.red { color: var(--error); }
    .stat-value.purple { color: var(--accent2); }

    /* ADD URL */
    .add-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .add-input {
      flex: 1;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.08);
    }
    .add-input::placeholder { color: var(--muted); }
    .btn-add {
      padding: 11px 22px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-add:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-add:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* URL CARDS */
    .url-list { display: flex; flex-direction: column; gap: 14px; }

    .url-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
      animation: fadeIn 0.35s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .url-card:hover { border-color: rgba(255,255,255,0.1); }

    .url-card-header {
      display: flex; align-items: center;
      padding: 18px 22px;
      gap: 14px;
      cursor: pointer;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
    }
    .status-dot.up { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.up::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.2;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:0.2; } 50% { transform: scale(1.6); opacity:0; } }
    .status-dot.down { background: var(--error); box-shadow: 0 0 8px var(--error); }
    .status-dot.unknown { background: var(--muted); }
    .status-dot.warn { background: var(--warn); }

    .url-info { flex: 1; min-width: 0; }
    .url-name {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .url-meta {
      display: flex; gap: 16px;
      margin-top: 4px;
    }
    .url-meta-item {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .url-meta-item span { color: var(--text); }

    .status-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .status-badge.UP { background: rgba(0,229,160,0.1); color: var(--accent); }
    .status-badge.DOWN { background: rgba(255,95,109,0.1); color: var(--error); }
    .status-badge.UNKNOWN, .status-badge.UNKNOWN_ERROR { background: rgba(90,90,114,0.2); color: var(--muted); }
    .status-badge.REDIRECTED { background: rgba(124,106,247,0.1); color: var(--accent2); }
    .status-badge.CLIENT_ERROR, .status-badge.SERVER_ERROR { background: rgba(255,181,71,0.1); color: var(--warn); }

    .btn-delete {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 8px;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-delete:hover { border-color: var(--error); color: var(--error); background: rgba(255,95,109,0.06); }

    /* Chart */
    .chart-section {
      padding: 0 22px 18px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .chart-section.open { display: block; }
    .chart-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      padding: 14px 0 10px;
    }
    canvas.sparkline {
      width: 100%;
      height: 70px;
      display: block;
    }
    .chart-labels {
      display: flex; justify-content: space-between;
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      animation: toastIn 0.3s ease;
      pointer-events: none;
    }
    @keyframes toastIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .toast.success { background: rgba(0,229,160,0.15); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); }
    .toast.error { background: rgba(255,95,109,0.15); border: 1px solid rgba(255,95,109,0.3); color: var(--error); }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 10px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .refresh-btn {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <div class="nav-logo-icon">⬡</div>
    <div class="nav-logo-text">Uptime<span>Robot</span></div>
  </div>
  <div class="nav-right">
    <div class="nav-email" id="nav-email"></div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-subtitle" id="last-refresh">Loading...</div>
    </div>
    <button class="refresh-btn" onclick="loadUrls(true)" id="refresh-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Refresh
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Total Monitored</div>
      <div class="stat-value purple" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Currently Up</div>
      <div class="stat-value green" id="stat-up">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Currently Down</div>
      <div class="stat-value red" id="stat-down">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Response</div>
      <div class="stat-value" id="stat-avg">—</div>
    </div>
  </div>

  <!-- Add URL -->
  <div class="add-section">
    <input type="url" class="add-input" id="new-url" placeholder="https://example.com" />
    <button class="btn-add" id="btn-add" onclick="addUrl()">+ Add URL</button>
  </div>

  <!-- URL List -->
  <div class="url-list" id="url-list">
    <!-- Loading skeletons -->
    <div style="height:80px" class="skeleton"></div>
    <div style="height:80px" class="skeleton"></div>
    <div style="height:80px" class="skeleton"></div>
  </div>
</main>

<script>
const API = '';
const email = localStorage.getItem('ur_email');

// Handle OAuth redirect: if we're coming back with ?token=xxx in URL
const params = new URLSearchParams(window.location.search);
if (params.has('token')) {
  localStorage.setItem('ur_token', params.get('token'));
  window.history.replaceState({}, '', 'dashboard.html');
}

if (!localStorage.getItem('ur_token') && !params.has('token')) {
  window.location.href = 'index.html';
}

document.getElementById('nav-email').textContent = email || '';

// --- History stored in localStorage for charts ---
function getHistory(urlId) {
  try { return JSON.parse(localStorage.getItem('ur_hist_' + urlId) || '[]'); } catch { return []; }
}
function pushHistory(urlId, rt, status) {
  const hist = getHistory(urlId);
  hist.push({ t: Date.now(), rt, status });
  if (hist.length > 30) hist.splice(0, hist.length - 30); // keep last 30
  localStorage.setItem('ur_hist_' + urlId, JSON.stringify(hist));
}

// --- API calls with auto-refresh ---
let accessToken = localStorage.getItem('ur_token');
let isRefreshing = false;

async function apiFetch(path, opts = {}) {
  let res = await fetch(API + path, {
    ...opts,
    credentials: 'include',       // always send cookie (needed for refresh flow)
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });

  // If 401 — try refreshing once before giving up
  if (res.status === 401 && !isRefreshing) {
    isRefreshing = true;
    const refreshed = await tryRefresh();
    isRefreshing = false;

    if (refreshed) {
      // Got a new access token — retry original request
      res = await fetch(API + path, {
        ...opts,
        credentials: 'include',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });
    } else {
      // Refresh failed — session truly dead, force login
      forceLogout();
      return null;
    }
  }

  return res;
}

// Hit /refresh endpoint — cookie is sent automatically by browser
async function tryRefresh() {
  try {
    const res = await fetch(`${API}/uptimerobot/auth/refresh`, {
      method: 'POST',
      credentials: 'include'      // browser sends HttpOnly cookie automatically
    });
    if (!res.ok) return false;
    const data = await res.json();
    accessToken = data.token;                         // update in-memory token
    localStorage.setItem('ur_token', data.token);    // persist for page reloads
    return true;
  } catch {
    return false;
  }
}

// Logout — kills session in Redis + clears cookie + redirects
async function forceLogout() {
  localStorage.removeItem('ur_token');
  localStorage.removeItem('ur_email');
  window.location.href = 'index.html';
}

// --- Render ---
function statusClass(s) {
  if (!s) return 'unknown';
  if (s === 'UP') return 'up';
  if (s === 'DOWN' || s === 'SERVER_ERROR' || s === 'CLIENT_ERROR') return 'down';
  return 'warn';
}

function drawSparkline(canvas, history) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = 70;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const data = history.filter(h => h.rt > 0).slice(-20);
  if (data.length < 2) {
    ctx.fillStyle = 'rgba(90,90,114,0.3)';
    ctx.font = '11px DM Mono, monospace';
    ctx.fillText('Not enough data yet — check back after a few cycles', 0, H / 2);
    return;
  }

  const vals = data.map(d => d.rt);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;

  const pad = { t: 8, b: 8, l: 0, r: 0 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;

  const pts = data.map((d, i) => ({
    x: pad.l + (i / (data.length - 1)) * plotW,
    y: pad.t + plotH - ((d.rt - min) / range) * plotH
  }));

  // Area fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
  grad.addColorStop(0, 'rgba(0,229,160,0.18)');
  grad.addColorStop(1, 'rgba(0,229,160,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, H - pad.b);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length - 1].x, H - pad.b);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = '#00e5a0';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Last dot
  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#00e5a0';
  ctx.fill();
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function renderCard(url, idx) {
  const hist = getHistory(url.id);
  const status = url.lastStatus || url.LastStatus || 'UNKNOWN';
  const rt = url.responseTime;
  const lastChecked = url.lastchecked ? new Date(url.lastchecked.replace(' ', 'T')).toLocaleTimeString() : 'Never';
  const cardId = 'card-' + url.id;

  const card = document.createElement('div');
  card.className = 'url-card';
  card.style.animationDelay = (idx * 0.06) + 's';
  card.id = cardId;

  const histFirst = hist.length > 0 ? formatTime(hist[0].t) : '';
  const histLast = hist.length > 0 ? formatTime(hist[hist.length - 1].t) : '';

  card.innerHTML = `
    <div class="url-card-header" onclick="toggleChart('${url.id}')">
      <div class="status-dot ${statusClass(status)}"></div>
      <div class="url-info">
        <div class="url-name">${url.url}</div>
        <div class="url-meta">
          <div class="url-meta-item">Response: <span>${rt > 0 ? rt + 'ms' : '—'}</span></div>
          <div class="url-meta-item">Last checked: <span>${lastChecked}</span></div>
          <div class="url-meta-item">History: <span>${hist.length} points</span></div>
        </div>
      </div>
      <div class="status-badge ${status}">${status}</div>
      <button class="btn-delete" onclick="deleteUrl(event, ${url.id})">✕</button>
    </div>
    <div class="chart-section" id="chart-${url.id}">
      <div class="chart-title">Response Time (ms) — last ${Math.min(hist.length, 20)} readings</div>
      <canvas class="sparkline" id="spark-${url.id}"></canvas>
      <div class="chart-labels">
        <span>${histFirst}</span>
        <span>${histLast}</span>
      </div>
    </div>
  `;
  return card;
}

let openCharts = new Set();
function toggleChart(urlId) {
  const section = document.getElementById('chart-' + urlId);
  if (!section) return;
  const isOpen = section.classList.toggle('open');
  if (isOpen) {
    openCharts.add(urlId);
    requestAnimationFrame(() => {
      const canvas = document.getElementById('spark-' + urlId);
      if (canvas) drawSparkline(canvas, getHistory(urlId));
    });
  } else {
    openCharts.delete(urlId);
  }
}

function updateStats(urls) {
  const total = urls.length;
  const up = urls.filter(u => (u.lastStatus || u.LastStatus) === 'UP').length;
  const down = urls.filter(u => ['DOWN','SERVER_ERROR','CLIENT_ERROR'].includes(u.lastStatus || u.LastStatus)).length;
  const rts = urls.map(u => u.responseTime).filter(r => r > 0);
  const avg = rts.length ? Math.round(rts.reduce((a,b) => a+b,0) / rts.length) : null;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-up').textContent = up;
  document.getElementById('stat-down').textContent = down;
  document.getElementById('stat-avg').textContent = avg !== null ? avg + 'ms' : '—';
}

async function loadUrls(manual = false) {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  const res = await apiFetch('/uptimerobot/geturls');
  btn.classList.remove('spinning');
  if (!res) return;

  const urls = await res.json();

  // Push history for each URL
  urls.forEach(url => {
    const status = url.lastStatus || url.LastStatus;
    if (status) pushHistory(url.id, url.responseTime, status);
  });

  updateStats(urls);

  const list = document.getElementById('url-list');
  list.innerHTML = '';

  if (urls.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📡</div><p>No URLs monitored yet.<br>Add one above to get started.</p></div>`;
  } else {
    urls.forEach((url, i) => {
      const card = renderCard(url, i);
      list.appendChild(card);
    });

    // Restore open charts
    openCharts.forEach(id => {
      const section = document.getElementById('chart-' + id);
      if (section) {
        section.classList.add('open');
        const canvas = document.getElementById('spark-' + id);
        if (canvas) requestAnimationFrame(() => drawSparkline(canvas, getHistory(id)));
      }
    });
  }

  const now = new Date();
  document.getElementById('last-refresh').textContent = 'Last refreshed at ' + now.toLocaleTimeString();
  if (manual) showToast('Refreshed!', 'success');
}

async function addUrl() {
  const input = document.getElementById('new-url');
  const url = input.value.trim();
  if (!url) return showToast('Please enter a URL', 'error');
  if (!url.startsWith('http')) return showToast('URL must start with http:// or https://', 'error');

  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  btn.textContent = 'Adding...';

  const res = await apiFetch('/uptimerobot/addurl', {
    method: 'POST',
    body: JSON.stringify({ url })
  });

  btn.disabled = false;
  btn.textContent = '+ Add URL';

  if (res && res.ok) {
    input.value = '';
    showToast('URL added successfully!', 'success');
    await loadUrls();
  } else {
    showToast('Failed to add URL', 'error');
  }
}

async function deleteUrl(e, urlId) {
  e.stopPropagation();
  const res = await apiFetch('/uptimerobot/deleteurl/' + urlId, { method: 'DELETE' });
  if (res && res.ok) {
    localStorage.removeItem('ur_hist_' + urlId);
    openCharts.delete(urlId);
    showToast('URL removed', 'success');
    await loadUrls();
  } else {
    showToast('Failed to delete', 'error');
  }
}

async function logout() {
  try {
    await fetch(`${API}/uptimerobot/auth/logout`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Authorization': 'Bearer ' + accessToken }
    });
  } catch (e) { /* still clear local state even if call fails */ }
  localStorage.removeItem('ur_token');
  localStorage.removeItem('ur_email');
  window.location.href = 'index.html';
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Enter to add URL
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('new-url')) addUrl();
});

// Auto-refresh every 60 seconds (match your backend scheduler)
loadUrls();
setInterval(() => loadUrls(), 60000);
</script>
