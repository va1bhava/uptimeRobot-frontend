<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UptimeRobot — Dashboard</title>
  <meta name="description"
    content="Monitor and manage your website uptime with real-time status, response time charts, and instant alerts." />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #06060e;
      --surface: rgba(12, 12, 24, 0.55);
      --surface-solid: #0c0c18;
      --surface2: #12121e;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --accent: #00e5a0;
      --accent-dim: rgba(0, 229, 160, 0.12);
      --accent2: #9b6dff;
      --accent2-dim: rgba(155, 109, 255, 0.12);
      --accent3: #00d4ff;
      --text: #e8eaf0;
      --text-secondary: #a0a0b8;
      --muted: #4a4a6a;
      --error: #ff6b8a;
      --error-dim: rgba(255, 107, 138, 0.12);
      --warn: #ffb547;
      --warn-dim: rgba(255, 181, 71, 0.12);
      --radius: 16px;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Background */
    body::before {
      content: '';
      position: fixed;
      width: 800px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(0, 229, 160, 0.04) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 0;
      animation: bgFloat 20s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(155, 109, 255, 0.03) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      pointer-events: none;
      z-index: 0;
      animation: bgFloat2 25s ease-in-out infinite;
    }

    @keyframes bgFloat {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(60px, 40px);
      }
    }

    @keyframes bgFloat2 {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-40px, -30px);
      }
    }

    /* ===== AUTO-REFRESH PROGRESS BAR ===== */
    .refresh-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      z-index: 200;
      width: 0%;
      transition: width 1s linear;
      box-shadow: 0 0 10px var(--accent);
    }

    /* ===== NAV ===== */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      background: rgba(6, 6, 14, 0.8);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }

    /* Gradient line under nav */
    nav::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 160, 0.2), rgba(155, 109, 255, 0.2), transparent);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoPulse 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .nav-logo-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .nav-logo-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.2) 50%, transparent 60%);
      animation: logoShimmer 3s ease-in-out infinite;
    }

    @keyframes logoPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 229, 160, 0.3);
      }

      50% {
        box-shadow: 0 0 16px 3px rgba(0, 229, 160, 0.12);
      }
    }

    @keyframes logoShimmer {

      0%,
      100% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(100%);
      }
    }

    .nav-logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .nav-logo-text span {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .nav-email {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-logout {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout svg {
      width: 14px;
      height: 14px;
    }

    .btn-logout:hover {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-dim);
    }

    /* ===== MAIN ===== */
    main {
      max-width: 940px;
      margin: 0 auto;
      padding: 36px 24px 60px;
      position: relative;
      z-index: 1;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: fadeInUp 0.5s var(--ease-spring) both;
    }

    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      transition: all 0.35s var(--ease-spring);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.5s var(--ease-spring) both;
    }

    .stat-card:nth-child(1) {
      animation-delay: 0.05s;
    }

    .stat-card:nth-child(2) {
      animation-delay: 0.1s;
    }

    .stat-card:nth-child(3) {
      animation-delay: 0.15s;
    }

    .stat-card:nth-child(4) {
      animation-delay: 0.2s;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      border-radius: 16px 16px 0 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-card:nth-child(1)::before {
      background: linear-gradient(90deg, var(--accent2), var(--accent3));
    }

    .stat-card:nth-child(2)::before {
      background: linear-gradient(90deg, var(--accent), #00c4ff);
    }

    .stat-card:nth-child(3)::before {
      background: linear-gradient(90deg, var(--error), #ff9a76);
    }

    .stat-card:nth-child(4)::before {
      background: linear-gradient(90deg, var(--accent3), var(--accent2));
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.4);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .stat-icon.purple {
      background: var(--accent2-dim);
    }

    .stat-icon.green {
      background: var(--accent-dim);
    }

    .stat-icon.red {
      background: var(--error-dim);
    }

    .stat-icon.cyan {
      background: rgba(0, 212, 255, 0.12);
    }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-value.green {
      color: var(--accent);
    }

    .stat-value.red {
      color: var(--error);
    }

    .stat-value.purple {
      color: var(--accent2);
    }

    .stat-value.cyan {
      color: var(--accent3);
    }

    /* ===== ADD URL ===== */
    .add-section {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: border-color 0.3s;
      animation: fadeInUp 0.5s 0.25s var(--ease-spring) both;
    }

    .add-section:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .add-input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .add-input-prefix {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.3s var(--ease-spring);
    }

    .add-input:focus~.add-input-prefix,
    .add-input:not(:placeholder-shown)~.add-input-prefix {
      opacity: 0;
      /* Hidden since URL typed directly */
    }

    .add-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
      background: rgba(0, 229, 160, 0.02);
    }

    .add-input::placeholder {
      color: var(--muted);
    }

    .btn-add {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), #00c4ff);
      color: #000;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s var(--ease-spring);
      position: relative;
      overflow: hidden;
    }

    .btn-add::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s ease;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px -4px rgba(0, 229, 160, 0.3);
    }

    .btn-add:hover::after {
      left: 150%;
    }

    .btn-add:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-add:disabled::after {
      display: none;
    }

    /* ===== URL CARDS ===== */
    .url-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .url-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.35s var(--ease-spring);
      animation: cardSlideIn 0.5s var(--ease-spring) both;
    }

    @keyframes cardSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .url-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .url-card-header {
      display: flex;
      align-items: center;
      padding: 20px 22px;
      gap: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .url-card-header:hover {
      background: rgba(255, 255, 255, 0.015);
    }

    /* Status dot with animated rings */
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
    }

    .status-dot.up {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-dot.up::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.25;
      animation: dotPulse1 2s ease-in-out infinite;
    }

    .status-dot.up::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.1;
      animation: dotPulse2 2s 0.3s ease-in-out infinite;
    }

    @keyframes dotPulse1 {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.25;
      }

      50% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    @keyframes dotPulse2 {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.1;
      }

      50% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .status-dot.down {
      background: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .status-dot.down::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--error);
      opacity: 0.25;
      animation: dotPulse1 1.5s ease-in-out infinite;
    }

    .status-dot.unknown {
      background: var(--muted);
    }

    .status-dot.warn {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
    }

    .url-info {
      flex: 1;
      min-width: 0;
    }

    .url-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.1px;
    }

    .url-meta {
      display: flex;
      gap: 18px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .url-meta-item {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .url-meta-item span {
      color: var(--text-secondary);
    }

    .url-meta-item svg {
      width: 12px;
      height: 12px;
      opacity: 0.5;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 8px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .status-badge.UP {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .status-badge.DOWN {
      background: var(--error-dim);
      color: var(--error);
    }

    .status-badge.UNKNOWN,
    .status-badge.UNKNOWN_ERROR {
      background: rgba(74, 74, 106, 0.2);
      color: var(--muted);
    }

    .status-badge.REDIRECTED {
      background: var(--accent2-dim);
      color: var(--accent2);
    }

    .status-badge.CLIENT_ERROR,
    .status-badge.SERVER_ERROR {
      background: var(--warn-dim);
      color: var(--warn);
    }

    /* Delete button with confirm state */
    .btn-delete {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 13px;
      transition: all 0.25s;
      flex-shrink: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-delete:hover {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-dim);
    }

    .btn-delete.confirming {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 12px;
      animation: confirmPulse 0.3s ease;
    }

    @keyframes confirmPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Expand icon */
    .expand-icon {
      color: var(--muted);
      transition: transform 0.3s var(--ease-spring), color 0.2s;
      flex-shrink: 0;
    }

    .expand-icon.open {
      transform: rotate(180deg);
      color: var(--accent);
    }

    /* ===== CHART SECTION ===== */
    .chart-section {
      padding: 0 22px;
      border-top: 1px solid var(--border);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s var(--ease-spring), opacity 0.35s ease, padding 0.35s;
    }

    .chart-section.open {
      max-height: 200px;
      opacity: 1;
      padding: 0 22px 20px;
    }

    .chart-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      padding: 14px 0 10px;
    }

    .sparkline-container {
      position: relative;
      width: 100%;
      height: 80px;
    }

    canvas.sparkline {
      width: 100%;
      height: 80px;
      display: block;
    }

    /* Tooltip */
    .chart-tooltip {
      position: absolute;
      background: var(--surface-solid);
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .chart-tooltip.visible {
      opacity: 1;
    }

    .chart-tooltip .tt-value {
      color: var(--accent);
      font-weight: 500;
    }

    .chart-tooltip .tt-time {
      color: var(--muted);
      font-size: 10px;
    }

    .chart-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 70px 0;
      color: var(--muted);
      animation: fadeInUp 0.5s var(--ease-spring);
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(155, 109, 255, 0.06);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
    }

    .empty-icon::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dashed rgba(155, 109, 255, 0.15);
      animation: emptyRotate 12s linear infinite;
    }

    @keyframes emptyRotate {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .toast {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.4s var(--ease-spring);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      min-width: 240px;
      position: relative;
      overflow: hidden;
    }

    .toast.removing {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateX(40px) scale(0.95);
      }
    }

    .toast-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .toast.success {
      background: rgba(0, 229, 160, 0.12);
      border: 1px solid rgba(0, 229, 160, 0.2);
      color: var(--accent);
    }

    .toast.error {
      background: rgba(255, 107, 138, 0.12);
      border: 1px solid rgba(255, 107, 138, 0.2);
      color: var(--error);
    }

    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      border-radius: 0 0 12px 12px;
      animation: toastProgress 2.5s linear forwards;
    }

    .toast.success .toast-progress {
      background: var(--accent);
    }

    .toast.error .toast-progress {
      background: var(--error);
    }

    @keyframes toastProgress {
      from {
        width: 100%;
      }

      to {
        width: 0%;
      }
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, rgba(18, 18, 30, 0.8) 25%, rgba(24, 24, 36, 0.8) 50%, rgba(18, 18, 30, 0.8) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease infinite;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    /* ===== REFRESH BUTTON ===== */
    .refresh-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .refresh-btn.spinning svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }

      nav {
        padding: 0 16px;
      }

      main {
        padding: 24px 16px 48px;
      }

      .nav-email {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .stats-bar {
        grid-template-columns: 1fr;
      }

      .add-section {
        flex-direction: column;
      }

      .btn-add {
        width: 100%;
      }

      .url-meta {
        gap: 10px;
      }
    }

    /* Keyboard focus */
    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input:focus-visible {
      outline: none;
    }

    /* Status change flash */
    @keyframes statusFlash {

      0%,
      100% {
        background: var(--surface);
      }

      50% {
        background: rgba(0, 229, 160, 0.05);
      }
    }

    .url-card.flash-up {
      animation: statusFlash 0.6s ease;
    }

    @keyframes statusFlashDown {

      0%,
      100% {
        background: var(--surface);
      }

      50% {
        background: rgba(255, 107, 138, 0.05);
      }
    }

    .url-card.flash-down {
      animation: statusFlashDown 0.6s ease;
    }
  </style>
</head>

<body>

  <div class="refresh-progress" id="refresh-progress"></div>

  <nav>
    <div class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.18L18.36 7.5 12 10.82 5.64 7.5 12 4.18zM5 9.06l6 3.32v6.34l-6-3.32V9.06zm8 9.66V12.38l6-3.32v6.34l-6 3.32z" />
        </svg>
      </div>
      <div class="nav-logo-text">Uptime<span>Robot</span></div>
    </div>
    <div class="nav-right">
      <div class="nav-avatar" id="nav-avatar"></div>
      <div class="nav-email" id="nav-email"></div>
      <button class="btn-logout" id="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Sign Out
      </button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <div class="page-subtitle" id="last-refresh">Loading...</div>
      </div>
      <button class="refresh-btn" onclick="loadUrls(true)" id="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
        Refresh
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-icon purple">📊</div>
        <div class="stat-label">Total Monitored</div>
        <div class="stat-value purple" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✓</div>
        <div class="stat-label">Currently Up</div>
        <div class="stat-value green" id="stat-up">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">✕</div>
        <div class="stat-label">Currently Down</div>
        <div class="stat-value red" id="stat-down">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon cyan">⚡</div>
        <div class="stat-label">Avg Response</div>
        <div class="stat-value cyan" id="stat-avg">—</div>
      </div>
    </div>

    <!-- Add URL -->
    <div class="add-section" id="add-section">
      <div class="add-input-wrapper">
        <input type="url" class="add-input" id="new-url" placeholder="https://example.com — add a URL to monitor" />
      </div>
      <button class="btn-add" id="btn-add" onclick="addUrl()">+ Add URL</button>
    </div>

    <!-- URL List -->
    <div class="url-list" id="url-list">
      <div style="height:84px" class="skeleton"></div>
      <div style="height:84px" class="skeleton"></div>
      <div style="height:84px" class="skeleton"></div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    const API = '';
    const email = localStorage.getItem('ur_email');

    // Handle OAuth redirect
    const params = new URLSearchParams(window.location.search);
    if (params.has('token')) {
      localStorage.setItem('ur_token', params.get('token'));
      window.history.replaceState({}, '', 'dashboard.html');
    }

    if (!localStorage.getItem('ur_token') && !params.has('token')) {
      window.location.href = 'index.html';
    }

    // Set nav email & avatar
    document.getElementById('nav-email').textContent = email || '';
    document.getElementById('nav-avatar').textContent = email ? email.charAt(0) : '?';

    // --- History stored in localStorage for charts ---
    function getHistory(urlId) {
      try { return JSON.parse(localStorage.getItem('ur_hist_' + urlId) || '[]'); } catch { return []; }
    }
    function pushHistory(urlId, rt, status) {
      const hist = getHistory(urlId);
      hist.push({ t: Date.now(), rt, status });
      if (hist.length > 30) hist.splice(0, hist.length - 30);
      localStorage.setItem('ur_hist_' + urlId, JSON.stringify(hist));
    }

    // --- API calls with auto-refresh ---
    let accessToken = localStorage.getItem('ur_token');
    let isRefreshing = false;

    async function apiFetch(path, opts = {}) {
      let res = await fetch(API + path, {
        ...opts,
        credentials: 'include',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });

      if (res.status === 401 && !isRefreshing) {
        isRefreshing = true;
        const refreshed = await tryRefresh();
        isRefreshing = false;

        if (refreshed) {
          res = await fetch(API + path, {
            ...opts,
            credentials: 'include',
            headers: {
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json',
              ...(opts.headers || {})
            }
          });
        } else {
          forceLogout();
          return null;
        }
      }
      return res;
    }

    async function tryRefresh() {
      try {
        const res = await fetch(`${API}/uptimerobot/auth/refresh`, {
          method: 'POST',
          credentials: 'include'
        });
        if (!res.ok) return false;
        const data = await res.json();
        accessToken = data.token;
        localStorage.setItem('ur_token', data.token);
        return true;
      } catch {
        return false;
      }
    }

    async function forceLogout() {
      localStorage.removeItem('ur_token');
      localStorage.removeItem('ur_email');
      window.location.href = 'index.html';
    }

    // --- Animated Counter ---
    function animateCounter(element, target, suffix = '') {
      const duration = 800;
      const startTime = performance.now();
      const startVal = parseInt(element.textContent) || 0;

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(startVal + (target - startVal) * eased);
        element.textContent = current + suffix;
        if (progress < 1) requestAnimationFrame(update);
      }

      if (startVal !== target) requestAnimationFrame(update);
      else element.textContent = target + suffix;
    }

    // --- Render ---
    function statusClass(s) {
      if (!s) return 'unknown';
      if (s === 'UP') return 'up';
      if (s === 'DOWN' || s === 'SERVER_ERROR' || s === 'CLIENT_ERROR') return 'down';
      return 'warn';
    }

    // Track previous status for flash animation
    let prevStatuses = {};

    function drawSparkline(canvas, history, animate = false) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.offsetWidth, H = 80;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.scale(dpr, dpr);

      const data = history.filter(h => h.rt > 0).slice(-20);
      if (data.length < 2) {
        ctx.fillStyle = 'rgba(74,74,106,0.4)';
        ctx.font = '11px JetBrains Mono, monospace';
        ctx.fillText('Not enough data yet — check back after a few cycles', 0, H / 2);
        return { pts: [], data: [] };
      }

      const vals = data.map(d => d.rt);
      const min = Math.min(...vals), max = Math.max(...vals);
      const range = max - min || 1;

      const pad = { t: 10, b: 10, l: 0, r: 0 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;

      const pts = data.map((d, i) => ({
        x: pad.l + (i / (data.length - 1)) * plotW,
        y: pad.t + plotH - ((d.rt - min) / range) * plotH
      }));

      function drawFrame(frameProgress) {
        ctx.clearRect(0, 0, W, H);
        const pointCount = animate ? Math.ceil(frameProgress * pts.length) : pts.length;
        if (pointCount < 2) return;

        const activePts = pts.slice(0, pointCount);

        // Grid lines
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const gy = pad.t + (plotH / 3) * i;
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(W, gy);
          ctx.stroke();
        }

        // Area fill
        const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
        grad.addColorStop(0, 'rgba(0,229,160,0.15)');
        grad.addColorStop(1, 'rgba(0,229,160,0)');
        ctx.beginPath();
        ctx.moveTo(activePts[0].x, H - pad.b);
        activePts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(activePts[activePts.length - 1].x, H - pad.b);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // Line
        ctx.beginPath();
        activePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = '#00e5a0';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();

        // Last dot with glow
        const last = activePts[activePts.length - 1];
        ctx.beginPath();
        ctx.arc(last.x, last.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,229,160,0.15)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(last.x, last.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00e5a0';
        ctx.fill();
      }

      if (animate) {
        let frame = 0;
        const totalFrames = 45;
        function step() {
          frame++;
          const progress = Math.min(frame / totalFrames, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          drawFrame(eased);
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      } else {
        drawFrame(1);
      }

      return { pts, data };
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function renderCard(url, idx) {
      const hist = getHistory(url.id);
      const status = url.lastStatus || url.LastStatus || 'UNKNOWN';
      const rt = url.responseTime;
      const lastChecked = url.lastchecked ? new Date(url.lastchecked.replace(' ', 'T')).toLocaleTimeString() : 'Never';
      const cardId = 'card-' + url.id;

      const card = document.createElement('div');
      card.className = 'url-card';
      card.style.animationDelay = (idx * 0.06) + 's';
      card.id = cardId;

      // Flash if status changed
      const prevStatus = prevStatuses[url.id];
      if (prevStatus && prevStatus !== status) {
        if (status === 'UP') card.classList.add('flash-up');
        else if (status === 'DOWN') card.classList.add('flash-down');
      }
      prevStatuses[url.id] = status;

      const histFirst = hist.length > 0 ? formatTime(hist[0].t) : '';
      const histLast = hist.length > 0 ? formatTime(hist[hist.length - 1].t) : '';

      card.innerHTML = `
    <div class="url-card-header" onclick="toggleChart('${url.id}')">
      <div class="status-dot ${statusClass(status)}"></div>
      <div class="url-info">
        <div class="url-name">${url.url}</div>
        <div class="url-meta">
          <div class="url-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>${rt > 0 ? rt + 'ms' : '—'}</span>
          </div>
          <div class="url-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>${lastChecked}</span>
          </div>
          <div class="url-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span>${hist.length} pts</span>
          </div>
        </div>
      </div>
      <div class="status-badge ${status}">${status}</div>
      <svg class="expand-icon ${openCharts.has(String(url.id)) ? 'open' : ''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      <button class="btn-delete" onclick="handleDelete(event, ${url.id})" id="del-${url.id}">✕</button>
    </div>
    <div class="chart-section" id="chart-${url.id}">
      <div class="chart-title">Response Time (ms) — last ${Math.min(hist.length, 20)} readings</div>
      <div class="sparkline-container" id="sparkcontainer-${url.id}">
        <canvas class="sparkline" id="spark-${url.id}"></canvas>
        <div class="chart-tooltip" id="tooltip-${url.id}"></div>
      </div>
      <div class="chart-labels">
        <span>${histFirst}</span>
        <span>${histLast}</span>
      </div>
    </div>
  `;
      return card;
    }

    // --- Chart interactivity ---
    let openCharts = new Set();
    let chartDataStore = {};

    function toggleChart(urlId) {
      urlId = String(urlId);
      const section = document.getElementById('chart-' + urlId);
      const icon = document.querySelector(`#card-${urlId} .expand-icon`);
      if (!section) return;

      const isOpen = section.classList.toggle('open');
      if (icon) icon.classList.toggle('open', isOpen);

      if (isOpen) {
        openCharts.add(urlId);
        requestAnimationFrame(() => {
          const canvas = document.getElementById('spark-' + urlId);
          if (canvas) {
            const result = drawSparkline(canvas, getHistory(urlId), true);
            chartDataStore[urlId] = result;
            setupChartTooltip(urlId);
          }
        });
      } else {
        openCharts.delete(urlId);
      }
    }

    function setupChartTooltip(urlId) {
      const container = document.getElementById('sparkcontainer-' + urlId);
      const tooltip = document.getElementById('tooltip-' + urlId);
      const canvas = document.getElementById('spark-' + urlId);
      if (!container || !tooltip || !canvas) return;

      container.addEventListener('mousemove', e => {
        const data = chartDataStore[urlId];
        if (!data || !data.pts || data.pts.length < 2) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;

        // Find closest point
        let closest = 0;
        let closestDist = Infinity;
        data.pts.forEach((p, i) => {
          const dist = Math.abs(p.x - mouseX);
          if (dist < closestDist) { closestDist = dist; closest = i; }
        });

        if (closestDist < 30 && data.data[closest]) {
          const pt = data.pts[closest];
          const d = data.data[closest];
          tooltip.innerHTML = `<div class="tt-value">${d.rt}ms</div><div class="tt-time">${formatTime(d.t)}</div>`;
          tooltip.style.left = (pt.x - 30) + 'px';
          tooltip.style.top = (pt.y - 45) + 'px';
          tooltip.classList.add('visible');
        } else {
          tooltip.classList.remove('visible');
        }
      });

      container.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
      });
    }

    // --- Delete with confirmation ---
    let deleteTimers = {};

    function handleDelete(e, urlId) {
      e.stopPropagation();
      const btn = document.getElementById('del-' + urlId);
      if (!btn) return;

      if (btn.classList.contains('confirming')) {
        // Second click — actually delete
        clearTimeout(deleteTimers[urlId]);
        btn.classList.remove('confirming');
        deleteUrl(urlId);
      } else {
        // First click — show confirm
        btn.classList.add('confirming');
        btn.textContent = 'Confirm?';
        deleteTimers[urlId] = setTimeout(() => {
          btn.classList.remove('confirming');
          btn.textContent = '✕';
        }, 3000);
      }
    }

    // --- Stats ---
    function updateStats(urls) {
      const total = urls.length;
      const up = urls.filter(u => (u.lastStatus || u.LastStatus) === 'UP').length;
      const down = urls.filter(u => ['DOWN', 'SERVER_ERROR', 'CLIENT_ERROR'].includes(u.lastStatus || u.LastStatus)).length;
      const rts = urls.map(u => u.responseTime).filter(r => r > 0);
      const avg = rts.length ? Math.round(rts.reduce((a, b) => a + b, 0) / rts.length) : null;

      animateCounter(document.getElementById('stat-total'), total);
      animateCounter(document.getElementById('stat-up'), up);
      animateCounter(document.getElementById('stat-down'), down);
      if (avg !== null) {
        animateCounter(document.getElementById('stat-avg'), avg, 'ms');
      } else {
        document.getElementById('stat-avg').textContent = '—';
      }
    }

    // --- Auto-refresh progress bar ---
    let refreshInterval;
    let progressInterval;

    function startRefreshProgress() {
      const bar = document.getElementById('refresh-progress');
      let elapsed = 0;
      const total = 60; // seconds

      clearInterval(progressInterval);
      bar.style.transition = 'none';
      bar.style.width = '0%';

      progressInterval = setInterval(() => {
        elapsed++;
        bar.style.transition = 'width 1s linear';
        bar.style.width = ((elapsed / total) * 100) + '%';
        if (elapsed >= total) {
          elapsed = 0;
          bar.style.transition = 'none';
          bar.style.width = '0%';
        }
      }, 1000);
    }

    // --- Load URLs ---
    async function loadUrls(manual = false) {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');

      const res = await apiFetch('/uptimerobot/geturls');
      btn.classList.remove('spinning');
      if (!res) return;

      const urls = await res.json();

      // Push history for each URL
      urls.forEach(url => {
        const status = url.lastStatus || url.LastStatus;
        if (status) pushHistory(url.id, url.responseTime, status);
      });

      updateStats(urls);

      const list = document.getElementById('url-list');
      list.innerHTML = '';

      if (urls.length === 0) {
        list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📡</div>
        <h3>No URLs monitored yet</h3>
        <p>Add your first URL above to start monitoring its uptime and performance.</p>
      </div>`;
      } else {
        urls.forEach((url, i) => {
          const card = renderCard(url, i);
          list.appendChild(card);
        });

        // Restore open charts
        openCharts.forEach(id => {
          const section = document.getElementById('chart-' + id);
          const icon = document.querySelector(`#card-${id} .expand-icon`);
          if (section) {
            section.classList.add('open');
            if (icon) icon.classList.add('open');
            const canvas = document.getElementById('spark-' + id);
            if (canvas) {
              requestAnimationFrame(() => {
                const result = drawSparkline(canvas, getHistory(id), false);
                chartDataStore[id] = result;
                setupChartTooltip(id);
              });
            }
          }
        });
      }

      const now = new Date();
      document.getElementById('last-refresh').textContent = 'Last refreshed at ' + now.toLocaleTimeString();
      if (manual) showToast('Refreshed!', 'success');

      // Reset progress bar
      startRefreshProgress();
    }

    async function addUrl() {
      const input = document.getElementById('new-url');
      const url = input.value.trim();
      if (!url) return showToast('Please enter a URL', 'error');
      if (!url.startsWith('http')) return showToast('URL must start with http:// or https://', 'error');

      const btn = document.getElementById('btn-add');
      btn.disabled = true;
      btn.textContent = 'Adding...';

      const res = await apiFetch('/uptimerobot/addurl', {
        method: 'POST',
        body: JSON.stringify({ url })
      });

      btn.disabled = false;
      btn.textContent = '+ Add URL';

      if (res && res.ok) {
        input.value = '';
        showToast('URL added successfully!', 'success');
        await loadUrls();
      } else {
        showToast('Failed to add URL', 'error');
      }
    }

    async function deleteUrl(urlId) {
      const res = await apiFetch('/uptimerobot/deleteurl/' + urlId, { method: 'DELETE' });
      if (res && res.ok) {
        localStorage.removeItem('ur_hist_' + urlId);
        openCharts.delete(String(urlId));
        delete prevStatuses[urlId];
        showToast('URL removed', 'success');
        await loadUrls();
      } else {
        showToast('Failed to delete', 'error');
      }
    }

    async function logout() {
      try {
        await fetch(`${API}/uptimerobot/auth/logout`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Authorization': 'Bearer ' + accessToken }
        });
      } catch (e) { /* still clear local state */ }
      localStorage.removeItem('ur_token');
      localStorage.removeItem('ur_email');
      window.location.href = 'index.html';
    }

    // --- Toast with stacking & progress ---
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.innerHTML = `
    <span class="toast-icon">${type === 'success' ? '✓' : '✕'}</span>
    <span>${msg}</span>
    <div class="toast-progress"></div>
  `;
      container.appendChild(t);

      // Remove after animation
      setTimeout(() => {
        t.classList.add('removing');
        setTimeout(() => t.remove(), 300);
      }, 2500);

      // Limit to 4 toasts
      while (container.children.length > 4) {
        container.firstChild.remove();
      }
    }

    // Enter to add URL
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.activeElement === document.getElementById('new-url')) addUrl();
    });

    // Start
    loadUrls();
    startRefreshProgress();
    setInterval(() => loadUrls(), 60000);
  </script>
</body>

</html>
