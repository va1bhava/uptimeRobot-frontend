<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UptimeRobot — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00e5a0;
      --accent2: #7c6af7;
      --text: #e8e8f0;
      --muted: #5a5a72;
      --error: #ff5f6d;
      --google: #fff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 70%);
      top: -100px; left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,106,247,0.07) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      pointer-events: none;
    }

    /* Grid lines */
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px 40px;
      box-shadow: 0 0 0 1px rgba(0,229,160,0.04), 0 40px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .logo-text span { color: var(--accent); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.08);
    }
    input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.2px;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 12px;
      font-family: 'DM Mono', monospace;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
    }
    .btn-google:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.15);
    }
    .btn-google svg { width: 18px; height: 18px; }

    .error-msg {
      background: rgba(255,95,109,0.1);
      border: 1px solid rgba(255,95,109,0.25);
      color: var(--error);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }

    .success-msg {
      background: rgba(0,229,160,0.08);
      border: 1px solid rgba(0,229,160,0.2);
      color: var(--accent);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .success-msg.show { display: block; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* OTP Step Styles */
    .otp-step { display: none; }
    .otp-step.active { display: block; animation: fadeSlide 0.35s ease both; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .otp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .otp-header .back-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .otp-header .back-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .otp-header .otp-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .otp-header .otp-email {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      margin-left: auto;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .otp-input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }
    .otp-input-group input {
      width: 46px;
      height: 54px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      border-radius: 12px;
      padding: 0;
      caret-color: var(--accent);
    }
    .otp-input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.12);
    }

    .otp-info {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .otp-info strong {
      color: var(--text);
      font-weight: 500;
    }

    .resend-link {
      background: none;
      border: none;
      color: var(--accent2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s;
      margin-top: 10px;
      display: block;
      text-align: center;
    }
    .resend-link:hover { color: var(--accent); }
    .resend-link:disabled {
      color: var(--muted);
      cursor: not-allowed;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <div class="logo-text">Uptime<span>Robot</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="panel active" id="panel-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">Sign In</button>
      <div class="divider">or</div>
      <a class="btn-google" href="/oauth2/authorization/google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>
      <div class="error-msg" id="login-error"></div>
      <div class="success-msg" id="login-success"></div>
    </div>

    <!-- REGISTER -->
    <div class="panel" id="panel-register">

      <!-- Step 1: Email + Password -->
      <div class="otp-step active" id="reg-step1">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" />
        </div>
        <button class="btn-primary" id="btn-send-otp" onclick="doSendOtp()">Send OTP</button>
        <div class="divider">or</div>
        <a class="btn-google" href="https://uptimerobot-xvf5.onrender.com/oauth2/authorization/google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>
      </div>

      <!-- Step 2: OTP Verification -->
      <div class="otp-step" id="reg-step2">
        <div class="otp-header">
          <button class="back-btn" onclick="goBackToStep1()" title="Go back">←</button>
          <span class="otp-title">Verify Email</span>
          <span class="otp-email" id="otp-display-email"></span>
        </div>
        <div class="otp-info">Enter the 6-digit code sent to<br/><strong id="otp-sent-email"></strong></div>
        <div class="otp-input-group" id="otp-inputs">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" />
        </div>
        <button class="btn-primary" id="btn-verify-otp" onclick="doVerifyOtp()">Verify & Create Account</button>
        <button class="resend-link" id="btn-resend" onclick="doResendOtp()">Resend OTP</button>
      </div>

      <div class="error-msg" id="reg-error"></div>
      <div class="success-msg" id="reg-success"></div>
    </div>
  </div>

  <script>
    const API = '';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'error-msg show';
    }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'success-msg show';
    }
    function clearMsgs(...ids) {
      ids.forEach(id => { document.getElementById(id).className = id.includes('error') ? 'error-msg' : 'success-msg'; });
    }

    async function doLogin() {
      clearMsgs('login-error', 'login-success');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return showError('login-error', 'Please fill in all fields.');

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch(`${API}/uptimerobot/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',                          // ← receive HttpOnly cookie
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');
        localStorage.setItem('ur_token', data.token);     // ← access token in memory
        localStorage.setItem('ur_email', email);
        showSuccess('login-success', 'Success! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (e) {
        showError('login-error', e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    /* ---- Registration: 2-step OTP flow ---- */

    let pendingEmail = '';
    let pendingPassword = '';

    function goBackToStep1() {
      document.getElementById('reg-step2').classList.remove('active');
      document.getElementById('reg-step1').classList.add('active');
      clearMsgs('reg-error', 'reg-success');
    }

    function showOtpStep(email) {
      document.getElementById('reg-step1').classList.remove('active');
      document.getElementById('reg-step2').classList.add('active');
      document.getElementById('otp-display-email').textContent = email;
      document.getElementById('otp-sent-email').textContent = email;
      // Clear & focus first OTP digit
      document.querySelectorAll('.otp-digit').forEach(d => d.value = '');
      document.querySelector('.otp-digit').focus();
    }

    // Auto-advance OTP digit inputs
    document.querySelectorAll('.otp-digit').forEach((input, idx, arr) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 1);
        if (input.value && idx < arr.length - 1) arr[idx + 1].focus();
        // Auto-submit when all 6 digits filled
        if (idx === arr.length - 1 && input.value) {
          const otp = [...arr].map(d => d.value).join('');
          if (otp.length === 6) doVerifyOtp();
        }
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          arr[idx - 1].focus();
        }
      });
      // Handle paste of full OTP
      input.addEventListener('paste', e => {
        e.preventDefault();
        const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((ch, i) => { if (arr[i]) arr[i].value = ch; });
        if (pasted.length === 6) doVerifyOtp();
        else if (arr[pasted.length]) arr[pasted.length].focus();
      });
    });

    function getOtpValue() {
      return [...document.querySelectorAll('.otp-digit')].map(d => d.value).join('');
    }

    async function doSendOtp() {
      clearMsgs('reg-error', 'reg-success');
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!email || !password) return showError('reg-error', 'Please fill in all fields.');
      if (password.length < 6) return showError('reg-error', 'Password must be at least 6 characters.');

      const btn = document.getElementById('btn-send-otp');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sending OTP...';

      try {
        const res = await fetch(`${API}/uptimerobot/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || data.Error || data.Message || 'Failed to send OTP');
        }
        pendingEmail = email;
        pendingPassword = password;
        showOtpStep(email);
        showSuccess('reg-success', 'OTP sent! Check your inbox.');
      } catch (e) {
        showError('reg-error', e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    }

    async function doVerifyOtp() {
      clearMsgs('reg-error', 'reg-success');
      const otp = getOtpValue();
      if (otp.length !== 6) return showError('reg-error', 'Please enter the full 6-digit OTP.');

      const btn = document.getElementById('btn-verify-otp');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Verifying...';

      try {
        const res = await fetch(`${API}/uptimerobot/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',                          // ← receive HttpOnly cookie
          body: JSON.stringify({ email: pendingEmail, otp })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.Error || data.error || 'Invalid OTP, please try again.');
        }
        const data = await res.json();
        localStorage.setItem('ur_token', data.token);
        localStorage.setItem('ur_email', pendingEmail);
        showSuccess('reg-success', 'Account created! Redirecting...');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (e) {
        showError('reg-error', e.message);
        // Clear OTP fields for retry
        document.querySelectorAll('.otp-digit').forEach(d => d.value = '');
        document.querySelector('.otp-digit').focus();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify & Create Account';
      }
    }

    async function doResendOtp() {
      clearMsgs('reg-error', 'reg-success');
      const btn = document.getElementById('btn-resend');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(`${API}/uptimerobot/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, password: pendingPassword })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.Error || data.error || 'Could not resend OTP');
        }
        showSuccess('reg-success', 'New OTP sent! Check your inbox.');
        // Cooldown
        let cd = 30;
        btn.textContent = `Resend in ${cd}s`;
        const timer = setInterval(() => {
          cd--;
          btn.textContent = `Resend in ${cd}s`;
          if (cd <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Resend OTP'; }
        }, 1000);
      } catch (e) {
        showError('reg-error', e.message);
        btn.disabled = false;
        btn.textContent = 'Resend OTP';
      }
    }

    // Allow Enter key
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('panel-login').classList.contains('active')) {
        doLogin();
      } else if (document.getElementById('reg-step2').classList.contains('active')) {
        doVerifyOtp();
      } else {
        doSendOtp();
      }
    });

    // Handle OAuth redirect: Spring Boot sends back ?token=xxx
    const urlParams = new URLSearchParams(window.location.search);
    const oauthToken = urlParams.get('token');
    const oauthEmail = urlParams.get('email') || '';
    if (oauthToken) {
      localStorage.setItem('ur_token', oauthToken);
      localStorage.setItem('ur_email', oauthEmail);
      window.history.replaceState({}, '', 'index.html');
      window.location.href = 'dashboard.html';
    }

    // If already logged in, validate token before redirecting
    if (!oauthToken && localStorage.getItem('ur_token')) {
      (async () => {
        try {
          const res = await fetch(`${API}/uptimerobot/monitors`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('ur_token') }
          });
          if (res.ok) {
            window.location.href = 'dashboard.html';
          } else {
            // Token invalid/expired — clear and stay on login
            localStorage.removeItem('ur_token');
            localStorage.removeItem('ur_email');
          }
        } catch (e) {
          // Backend unreachable — clear and stay on login
          localStorage.removeItem('ur_token');
          localStorage.removeItem('ur_email');
        }
      })();
    }
  </script>
</body>
</html>
